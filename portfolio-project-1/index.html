<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate & Transit Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Property & Transit Finder</h1>
        <p>Find your ideal stay in Spain with transit details.</p>
    </header>
    
    <!-- Filter Panel -->
    <section class="filter-panel">
        <input type="text" id="search-input" placeholder="Search by location or title...">
        
        <select id="type-filter">
            <option value="All">All Types</option>
            <option value="Co-living">Co-living</option>
            <option value="Apartment">Apartment</option>
        </select>

        <select id="zone-filter">
            <option value="All">All Zones</option>
            <option value="Zone 1">Zone 1</option>
            <option value="Zone 2">Zone 2</option>
            <option value="Zone A">Zone A</option>
        </select>

        <div class="price-filter">
            <label for="price-slider">Max Price: €<span id="price-display">1500</span></label>
            <input type="range" id="price-slider" min="500" max="2000" step="50" value="1500">
        </div>

        <button id="toggle-favorites" class="fav-btn">❤️ Favorites Only</button>
        <button id="reset-filters" class="reset-btn">Reset</button>
    </section>

    <!-- JavaScript will inject property cards here -->
    <main id="property-container" class="grid-container"></main>

    <!-- Modal Overlay and Content -->
    <div id="property-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <div id="modal-body">
                <!-- Modal details will be injected here via JavaScript -->
            </div>
        </div>
    </div>

    <!-- type="module" is crucial for import/export to work -->
    <script type="module" src="app.js"></script>
</body>
</html>
