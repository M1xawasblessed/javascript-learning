<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Kanban Task Board</h1>
        <button id="add-task-btn" class="btn primary-btn">+ Add New Task</button>
    </header>

    <main class="board-container">
        <div class="column" id="todo" data-status="todo">
            <h2 class="column-title">To Do <span class="task-count" id="todo-count">0</span></h2>
            <div class="task-list" id="todo-list"></div>
        </div>

        <div class="column" id="in-progress" data-status="in-progress">
            <h2 class="column-title">In Progress <span class="task-count" id="in-progress-count">0</span></h2>
            <div class="task-list" id="in-progress-list"></div>
        </div>

        <div class="column" id="done" data-status="done">
            <h2 class="column-title">Done <span class="task-count" id="done-count">0</span></h2>
            <div class="task-list" id="done-list"></div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="Task title...">
                </div>

                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Task description..."></textarea>
                </div>

                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn secondary-btn">Cancel</button>
                    <button type="submit" class="btn primary-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
